<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>{{ title }}</title>
    <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-gray-900 text-white">
    <div class="flex min-h-screen">
        <!-- Sidebar -->
        <aside class="w-64 bg-gray-800 flex flex-col py-6 px-4 space-y-4">
            <h2 class="text-2xl font-bold mb-6">📊 Dashboard</h2>
            <nav class="flex flex-col gap-3">
                <a href="/" class="text-gray-300 hover:text-white px-3 py-2 rounded-md bg-gray-700">Monitoring</a>
                <a href="/scrape" class="text-gray-300 hover:text-white px-3 py-2 rounded-md hover:bg-gray-700">Scrape</a>
                <a href="/manage" class="text-gray-300 hover:text-white px-3 py-2 rounded-md hover:bg-gray-700">Manage</a>
                <a href="/account" class="text-gray-300 hover:text-white px-3 py-2 rounded-md hover:bg-gray-700">Account</a>
                <a href="/help" class="text-gray-300 hover:text-white px-3 py-2 rounded-md hover:bg-gray-700">Help</a>
            </nav>
        </aside>

        <!-- Content -->
        <main class="flex-1 p-10">
            <h1 class="text-3xl font-semibold mb-6">{{ title }}</h1>
            <div class="bg-gray-800 rounded-xl p-6">
                {{ content|safe }}
            </div>
        </main>
    </div>
</body>
</html>
