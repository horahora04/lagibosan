<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Monitoring</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <style>
        body {
            background-color: #0d1117;
            color: white;
        }
        .nav-link.active {
            font-weight: bold;
            color: #fff !important;
            background-color: #21262d;
            border-radius: 6px;
        }
        .btn-scrape {
            background-color: #2f81f7;
            color: white;
        }
        .btn-export {
            background-color: #238636;
            color: white;
        }
        .btn-account {
            background-color: #a371f7;
            color: white;
        }
        .btn-disabled {
            background-color: #4c4f53;
            color: #aaa;
        }
        .card-dark {
            background-color: #161b22;
            border: none;
        }
    </style>
</head>
<body>
    <!-- Navigation Bar -->
    <nav class="navbar navbar-expand-lg navbar-dark bg-dark px-3">
        <a class="navbar-brand" href="#">📊</a>
        <div class="collapse navbar-collapse">
            <ul class="navbar-nav me-auto mb-2 mb-lg-0">
                <li class="nav-item"><a class="nav-link" href="/">Home</a></li>
                <li class="nav-item"><a class="nav-link active" href="/monitoring">Monitoring</a></li>
                <li class="nav-item"><a class="nav-link" href="/scrape">Scrape</a></li>
                <li class="nav-item"><a class="nav-link" href="/manage">Manage</a></li>
                <li class="nav-item"><a class="nav-link" href="/account">Account</a></li>
                <li class="nav-item"><a class="nav-link" href="/help">Help</a></li>
            </ul>
        </div>
    </nav>

    <div class="container-fluid mt-4">
        <div class="row">
            <!-- Kiri: Semua menu utama -->
            <div class="col-md-3">
                <div class="card card-dark mb-3">
                    <div class="card-header">💬 Scrape Chat</div>
                    <div class="card-body d-grid gap-2">
                        <button class="btn btn-scrape">Get Chat, New Order, Complaint</button>
                        <button class="btn btn-scrape">Get Saldo & Login</button>
                        <button class="btn btn-scrape">Get Moderation Account</button>
                        <button class="btn btn-scrape">Activated Shop</button>
                        <button class="btn btn-scrape">Get QTY Products</button>
                        <button class="btn btn-disabled">Get Tem. Massupload (belum diupdate)</button>
                        <button class="btn btn-disabled">Delete Produk (belum diupdate)</button>
                        <button class="btn btn-disabled">Markup Price (belum diupdate)</button>
                        <button class="btn btn-disabled">Shipping Editor (belum diupdate)</button>
                        <button class="btn btn-scrape">Get Shipped & Complaint, All account</button>
                        <button class="btn btn-scrape">Get Close Info that Need to Upgrade</button>
                    </div>
                </div>

                <div class="card card-dark mb-3">
                    <div class="card-header">📤 Export Report</div>
                    <div class="card-body d-grid gap-2">
                        <button class="btn btn-export">Display New Order, RTS, Complaint</button>
                        <button class="btn btn-export">Export Chat</button>
                        <button class="btn btn-export">Export Saldo</button>
                        <button class="btn btn-export">Export Logout Account</button>
                        <button class="btn btn-export">Export Moderation Account</button>
                        <button class="btn btn-export">ClosedBatasRegular Account</button>
                        <button class="btn btn-export">Export All Account</button>
                    </div>
                </div>

                <div class="card card-dark mb-3">
                    <div class="card-header">👤 Account Management</div>
                    <div class="card-body d-grid gap-2">
                        <button class="btn btn-account">Delete Profile Account</button>
                        <button class="btn btn-account">Import New Account</button>
                        <button class="btn btn-account">Update Cookie</button>
                    </div>
                </div>
            </div>

            <!-- Kanan: Info atau Log Panel -->


        </div>
    </div>
</body>
</html>
